<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opération Radianite - Escape Game Valorant</title>
    <style>
        :root {
            --val-red: #ff4655;
            --val-light: #ece8e1;
            --val-dark: #0f1923;
            --tech-green: #00ffcc;
        }
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--val-dark);
            color: var(--val-light);
            overflow: hidden;
            user-select: none;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-size: cover;
            background-position: center;
            transition: background-image 0.5s ease-in-out;
            background-color: #111;
        }
        /* Calque flou affiché derrière les fonds verticaux (mode contain) */
        #bg-blur {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-size: cover;
            background-position: center;
            filter: blur(28px) brightness(0.45);
            transform: scale(1.15);
            z-index: 0;
            display: none;
        }
        /* Overlay dégradé pour le style Visual Novel */
        #game-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0) 50%, rgba(0,0,0,0.8) 100%);
            z-index: 1;
        }
        #character-sprite {
            position: absolute;
            bottom: 180px;
            left: 5%;
            height: 65vh;
            z-index: 2;
            transition: opacity 0.3s;
            display: none;
        }
        #dialog-box {
            position: absolute;
            bottom: 30px;
            left: 5%;
            right: 5%;
            height: 160px;
            background: rgba(15, 25, 35, 0.95);
            border: 2px solid var(--val-red);
            border-radius: 4px;
            padding: 20px 30px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            z-index: 10;
            box-shadow: 0 0 15px rgba(255, 70, 85, 0.3);
        }
        #character-name {
            font-weight: 800;
            color: var(--val-red);
            font-size: 1.4em;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        #dialog-text {
            font-size: 1.2em;
            flex-grow: 1;
            line-height: 1.5;
        }
        .action-text { font-style: italic; color: #ffeb3b; }

        #next-btn {
            align-self: flex-end;
            background: var(--val-red);
            color: var(--val-light);
            border: none;
            padding: 10px 25px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1em;
            border-radius: 2px;
            text-transform: uppercase;
            transition: background 0.2s;
        }
        #next-btn:hover { background: #ff5866; }

        /* ---------- Panneau des mini-jeux ---------- */
        #puzzle-ui {
            display: none;
            background: rgba(15, 25, 35, 0.96);
            position: absolute;
            top: 4%;
            left: 5%;
            right: 5%;
            bottom: 60px;
            padding: 18px 28px;
            border: 2px solid var(--tech-green);
            border-radius: 4px;
            overflow-y: auto;
            z-index: 5;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
            box-sizing: border-box;
        }
        #puzzle-title {
            color: var(--tech-green);
            font-size: 1.45em;
            margin: 0 0 8px 0;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(0,255,204,0.3);
            padding-bottom: 8px;
        }
        #puzzle-desc { font-size: 1.05em; line-height: 1.5; margin-bottom: 14px; }
        #puzzle-desc b { color: var(--tech-green); }

        .mg-wrap { display: flex; flex-direction: column; gap: 12px; align-items: center; }
        canvas.mg {
            width: 100%;
            max-width: 900px;
            background: rgba(0,0,0,0.45);
            border: 1px solid rgba(0,255,204,0.3);
            border-radius: 3px;
            display: block;
            touch-action: none;
        }
        .mg-row { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: center; }
        .mg-ctrl {
            display: flex; align-items: center; gap: 10px;
            background: rgba(0,0,0,0.45);
            padding: 8px 14px;
            border: 1px solid rgba(0,255,204,0.25);
            border-radius: 3px;
        }
        .mg-ctrl label { font-size: 0.9em; letter-spacing: 1px; text-transform: uppercase; }
        input[type=range] { width: 165px; accent-color: var(--tech-green); }
        .mg-val { color: var(--tech-green); font-family: monospace; font-size: 1.1em; min-width: 78px; text-align: right; display: inline-block; }
        .mg-btn {
            background: var(--tech-green);
            color: var(--val-dark);
            border: none;
            padding: 11px 24px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            border-radius: 2px;
            font-size: 1em;
        }
        .mg-btn:hover:enabled { background: #33ffdb; }
        .mg-btn:disabled { background: #33454f; color: #7d8d98; cursor: not-allowed; }
        .mg-btn.red { background: var(--val-red); color: #fff; }
        .mg-btn.red:hover:enabled { background: #ff5866; }
        .mg-info { font-family: monospace; font-size: 1.05em; }
        .ok { color: var(--tech-green); }
        .ko { color: var(--val-red); }
        #mg-feedback { margin-top: 12px; text-align: center; font-size: 1.1em; font-weight: bold; min-height: 24px; }

        /* Écran de calcul */
        .calc-data {
            background: rgba(0,0,0,0.45);
            border-left: 4px solid var(--tech-green);
            padding: 14px 20px;
            font-size: 1.12em;
            line-height: 1.8;
            max-width: 760px;
            font-family: monospace;
        }
        .calc-formule { color: var(--tech-green); font-weight: bold; }
        .calc-input {
            padding: 12px;
            font-size: 1.3em;
            width: 170px;
            background: rgba(0,0,0,0.55);
            border: 1px solid var(--tech-green);
            color: var(--tech-green);
            border-radius: 2px;
            font-family: monospace;
            text-align: right;
        }
        .calc-unit { font-family: monospace; font-size: 1.25em; color: var(--val-light); min-width: 60px; }

        /* Circuit */
        .wire {
            display: flex; align-items: center; justify-content: space-between; gap: 16px;
            background: rgba(0,0,0,0.45);
            border-left: 5px solid var(--tech-green);
            padding: 9px 14px;
            width: 300px;
            border-radius: 2px;
        }
        .wire.cut { border-left-color: #55656f; opacity: 0.45; }
        .wire span { font-family: monospace; font-size: 1.1em; }
        .wire button {
            background: transparent; border: 1px solid var(--val-red); color: var(--val-red);
            padding: 5px 12px; cursor: pointer; border-radius: 2px; text-transform: uppercase; font-size: 0.78em;
        }
        .wire.cut button { border-color: var(--tech-green); color: var(--tech-green); }
        .ohm {
            font-family: monospace; font-size: 2em; color: var(--tech-green);
            border: 2px solid var(--tech-green); padding: 10px 26px; border-radius: 3px;
            background: rgba(0,0,0,0.6);
        }
        /* Binaire */
        .bit {
            width: 60px; height: 72px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.55);
            border: 2px solid #55656f;
            color: #7d8d98;
            font-family: monospace; cursor: pointer; border-radius: 3px;
        }
        .bit.on { border-color: var(--tech-green); color: var(--tech-green); box-shadow: 0 0 12px rgba(0,255,204,0.35); }
        .bit .v { font-size: 1.8em; font-weight: bold; }
        .bit .w { font-size: 0.72em; opacity: 0.75; }
        .target-display {
            font-family: monospace; font-size: 2.2em; color: var(--val-red);
            border: 2px solid var(--val-red); padding: 4px 30px; border-radius: 3px;
            background: rgba(0,0,0,0.6);
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="bg-blur"></div>
    <img id="character-sprite" src="" alt="Character">

    <div id="puzzle-ui">
        <h2 id="puzzle-title">Titre</h2>
        <div id="puzzle-desc">Description</div>
        <div id="minigame-root"></div>
        <div id="mg-feedback"></div>
    </div>

    <div id="dialog-box">
        <div id="character-name">Nom</div>
        <div id="dialog-text">Texte</div>
        <button id="next-btn" onclick="nextScene()">Suivant</button>
    </div>
</div>

<script>
    // Configuration des noms de fichiers images attendus
    const images = {
        bg_intro: 'bg_intro.jpg',
        bg_porte: 'bg_porte.jpg',
        bg_couloir: 'bg_couloir.jpg',
        bg_gaz: 'bg_gaz.jpg',
        bg_eboulement: 'bg_eboulement.jpg',
        bg_spike: 'bg_spike.jpg',
        bg_victoire: 'bg_victoire.jpg',

        char_brimstone: 'char_brimstone.png',
        char_ami1: 'char_ami1.png',
        char_ami2: 'char_ami2.png',
        char_ami3: 'char_ami3.png',
        char_ami4: 'char_ami4.png',
        char_ami5: 'char_ami5.png',

        action_1: 'action_1.jpg',
        action_2: 'action_2.jpg',
        action_3: 'action_3.jpg',
        action_4: 'action_4.jpg',
        action_5: 'action_5.jpg'
    };

    // Structure de l'histoire (Visual Novel + Mini-jeux + Actions)
    const story = [
        { type: 'dialog', speaker: 'Brimstone', text: 'Écoutez-moi bien, Escouade Alpha. Kingdom a planté un Spike expérimental sur Bind. Vous êtes nos meilleurs ingénieurs. C\'est à vous de jouer.', bg: images.bg_intro, char: images.char_brimstone },

        // --- ÉTAPE 1 : TIR ---
        { type: 'dialog', speaker: 'Paul', text: 'Je suis en position devant les portes du Site B. C\'est verrouillé. Le bouton d\'urgence est à 40 mètres, droit devant.', bg: images.bg_porte, char: images.char_ami1 },
        { type: 'dialog', speaker: 'Paul', text: 'Mon arc est prêt, mais le capteur de tension est déréglé. Calculez la vitesse, puis réglez mon arc.', bg: images.bg_porte, char: images.char_ami1 },
        {
            type: 'calc',
            title: 'Étape 1 : Le Tir - Calcul',
            desc: 'Calculez la vitesse initiale v₀ que Paul doit régler sur son arc.',
            data: 'Distance du bouton : d = 40 m (même hauteur que l\'arc)<br>Angle de tir : θ = 45°<br>Pesanteur : g = 10 m/s²<br>Frottements négligés<br><span class="calc-formule">Portée : d = v₀² × sin(2θ) / g</span>',
            unit: 'm/s', answer: 20, tol: 0.05,
            bg: images.bg_porte
        },
        {
            type: 'minigame',
            game: 'tir',
            title: 'Étape 1 : Le Tir - Application',
            desc: 'Appliquez votre résultat : réglez v₀ et θ pour atteindre le bouton. Portée : <b>d = v₀² × sin(2θ) / g</b>, avec g = 10 m/s².',
            bg: images.bg_porte
        },
        { type: 'dialog', speaker: 'Paul', text: '<span class="action-text">*La flèche d\'énergie foudroie le ciel et frappe le bouton d\'urgence avec une précision chirurgicale.*</span> C\'est ouvert ! Entrez !', bg: images.action_1 },

        // --- ÉTAPE 2 : PIÈGE ---
        { type: 'dialog', speaker: 'Elyes', text: 'Bien tiré ! Laissez-moi passer devant... Attendez, il y a un panneau d\'alarme de Killjoy actif ici.', bg: images.bg_couloir, char: images.char_ami2 },
        { type: 'dialog', speaker: 'Elyes', text: 'Le court-circuit ne marche qu\'à 40 ohms. Calculez d\'abord, puis dites-moi quels fils couper.', bg: images.bg_couloir, char: images.char_ami2 },
        {
            type: 'calc',
            title: 'Étape 2 : Le Piège - Calcul',
            desc: 'Calculez la résistance Rp que doit atteindre le bloc de branches en parallèle.',
            data: 'Résistance à obtenir : Req = 40 Ω<br>Résistance fixe en série : R₀ = 20 Ω<br>Le bloc parallèle Rp est en série avec R₀<br><span class="calc-formule">Req = R₀ + Rp</span>',
            unit: 'Ω', answer: 20, tol: 0.05,
            bg: images.bg_couloir
        },
        {
            type: 'minigame',
            game: 'circuit',
            title: 'Étape 2 : Le Piège - Application',
            desc: 'Coupez des branches pour que le bloc parallèle vaille votre Rp, soit <b>40 Ω</b> au total. Les branches restantes sont en parallèle, en série avec R₀.',
            bg: images.bg_couloir
        },
        { type: 'dialog', speaker: 'Elyes', text: '<span class="action-text">*Le fer à souder crépite. Les composants grillent l\'un après l\'autre dans une petite gerbe d\'étincelles.*</span> Système désactivé. On avance !', bg: images.action_2, fit: 'contain' },

        // --- ÉTAPE 3 : GAZ ---
        { type: 'dialog', speaker: 'Gabin', text: 'Le couloir est libre ! Mais... *toux* Viper a déclenché son gaz toxique ! La salle des serveurs surchauffe !', bg: images.bg_gaz, char: images.char_ami3 },
        { type: 'dialog', speaker: 'Gabin', text: 'La valve s\'ouvre à 498 kPa. Trouvez le volume qu\'il me faut, puis réglez la cuve.', bg: images.bg_gaz, char: images.char_ami3 },
        {
            type: 'calc',
            title: 'Étape 3 : La Ventilation - Calcul',
            desc: 'Calculez le volume V, en litres, que Gabin doit atteindre dans la cuve.',
            data: 'Quantité de gaz : n = 10 mol<br>Constante : R = 8,3 J/(mol·K)<br>Température visée : T = 300 K<br>Pression d\'ouverture : P = 498 kPa<br>Rappel : 1 m³ = 1000 L<br><span class="calc-formule">Gaz parfait : P × V = n × R × T</span>',
            unit: 'L', answer: 50, tol: 0.5,
            bg: images.bg_gaz
        },
        {
            type: 'minigame',
            game: 'cuve',
            title: 'Étape 3 : La Ventilation - Application',
            desc: 'Réglez la cuve sur votre volume et sur T = 300 K pour entrer dans la zone verte. Gaz parfait : <b>P × V = n × R × T</b>, avec n = 10 mol et R = 8,3 J/(mol·K).',
            bg: images.bg_gaz
        },
        { type: 'dialog', speaker: 'Gabin', text: '<span class="action-text">*Force de tout son poids sur la valve brûlante. Un sifflement strident retentit.*</span> La pression s\'échappe ! Le gaz se dissipe.', bg: images.action_3 },

        // --- ÉTAPE 4 : ÉBOULEMENT ---
        { type: 'dialog', speaker: 'Maël', text: 'Le gaz s\'en va. Bon boulot ! Mince, l\'explosion d\'une conduite a provoqué un éboulement.', bg: images.bg_eboulement, char: images.char_ami4 },
        { type: 'dialog', speaker: 'Maël', text: 'J\'ai une poutre, mais je ne pousse pas à plus de 300 N. Calculez ma force, puis placez l\'appui.', bg: images.bg_eboulement, char: images.char_ami4 },
        {
            type: 'calc',
            title: 'Étape 4 : L\'Éboulement - Calcul',
            desc: 'Calculez la force F que Maël devra appliquer avec ce placement de l\'appui.',
            data: 'Poids de la dalle : P = 1500 N<br>Bras de levier côté dalle : d₁ = 0,40 m<br>Bras de levier côté Maël : d₂ = 2,40 m<br>Maël ne peut pas dépasser 300 N<br><span class="calc-formule">Équilibre : F × d₂ = P × d₁</span>',
            unit: 'N', answer: 250, tol: 0.5,
            bg: images.bg_eboulement
        },
        {
            type: 'minigame',
            game: 'levier',
            title: 'Étape 4 : L\'Éboulement - Application',
            desc: 'Glissez le point d\'appui jusqu\'à d₁ = 0,40 m, puis soulevez. À l\'équilibre : <b>F × d₂ = P × d₁</b>.',
            bg: images.bg_eboulement
        },
        { type: 'dialog', speaker: 'Maël', text: '<span class="action-text">*Les bras cybernétiques grincent, la poutre plie, et l\'énorme bloc de béton se soulève lentement dans un nuage de poussière.*</span> Vite, passez pendant que je la tiens !', bg: images.action_4 },

        // --- ÉTAPE 5 : DÉSAMORÇAGE ---
        { type: 'dialog', speaker: 'Timothé', text: 'La voie est libre ! Le Spike est juste là. Je connecte mon terminal au noyau.', bg: images.bg_spike, char: images.char_ami5 },
        { type: 'dialog', speaker: 'Timothé', text: 'Trois verrous, trois codes. Convertissez le premier, puis composez-le sur les interrupteurs.', bg: images.bg_spike, char: images.char_ami5 },
        {
            type: 'calc',
            title: 'Étape 5 : Le Désamorçage - Calcul',
            desc: 'Convertissez le code du premier verrou en base 10.',
            data: 'Séquence affichée par le noyau : 110010<br>Poids des bits, de gauche à droite : 32 - 16 - 8 - 4 - 2 - 1<br><span class="calc-formule">Valeur = somme des poids dont le bit vaut 1</span>',
            unit: '', answer: 50, tol: 0.01,
            bg: images.bg_spike
        },
        {
            type: 'minigame',
            game: 'binaire',
            title: 'Étape 5 : Le Désamorçage - Application',
            desc: 'Activez les bits pour composer le nombre affiché. Chaque bit vaut le poids indiqué en dessous.',
            bg: images.bg_spike
        },
        { type: 'dialog', speaker: 'Timothé', text: '<span class="action-text">*Les doigts volent sur le clavier holographique. Le code final est envoyé au noyau.*</span> Noyau désactivé !', bg: images.action_5 },

        // --- FIN ---
        { type: 'dialog', speaker: 'Brimstone', text: 'Spike désamorcé. Vous avez sauvé le Site B. Excellent travail, Escouade Alpha. Mission accomplie. Rentrez à la base.', bg: images.bg_victoire, char: images.char_brimstone }
    ];

    let currentScene = 0;
    let mgRaf = null;
    let mgSolved = false;

    function stopMg() {
        if (mgRaf) { cancelAnimationFrame(mgRaf); mgRaf = null; }
    }

    function feedback(html, cls) {
        const f = document.getElementById('mg-feedback');
        f.className = cls || '';
        f.innerHTML = html;
    }

    function mgSuccess(msg) {
        if (mgSolved) return;
        mgSolved = true;
        stopMg();
        feedback(msg || 'Verrou neutralisé.', 'ok');
        setTimeout(nextScene, 1200);
    }

    /* =======================================================
       MINI-JEUX
       ======================================================= */
    const MG = {};

    /* --- 1. Tir balistique --------------------------------- */
    MG.tir = {
        html: `
        <div class="mg-wrap">
            <canvas class="mg" id="c-tir" width="900" height="320"></canvas>
            <div class="mg-row">
                <div class="mg-ctrl">
                    <label>Vitesse v₀</label>
                    <input type="range" id="s-v" min="5" max="35" step="0.5" value="12">
                    <span class="mg-val" id="o-v">12.0 m/s</span>
                </div>
                <div class="mg-ctrl">
                    <label>Angle θ</label>
                    <input type="range" id="s-a" min="10" max="80" step="1" value="30">
                    <span class="mg-val" id="o-a">30 °</span>
                </div>
                <button class="mg-btn" id="b-fire">Tirer</button>
                <span class="mg-info" id="r-tir">Flèches tirées : 0</span>
            </div>
        </div>`,
        init() {
            const cv = document.getElementById('c-tir'), ctx = cv.getContext('2d');
            const W = cv.width, H = cv.height, G = 10, D = 40;
            const sx = 19, sy = 13, ox = 40, oy = H - 62;
            const px = x => ox + x * sx;
            const py = y => oy - y * sy;
            const sV = document.getElementById('s-v'), sA = document.getElementById('s-a');
            let shots = 0, flight = null, hit = false;

            function drawScene() {
                ctx.clearRect(0, 0, W, H);
                // Sol
                ctx.fillStyle = '#16242e';
                ctx.fillRect(0, oy, W, H - oy);
                ctx.strokeStyle = 'rgba(0,255,204,0.35)'; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.moveTo(0, oy); ctx.lineTo(W, oy); ctx.stroke();
                // Graduations
                ctx.fillStyle = 'rgba(236,232,225,0.5)';
                ctx.font = '11px monospace';
                for (let m = 0; m <= 40; m += 10) {
                    ctx.fillRect(px(m), oy, 1, 7);
                    ctx.fillText(m + ' m', px(m) - 9, oy + 22);
                }
                // Porte
                ctx.fillStyle = '#263946';
                ctx.fillRect(px(D) + 6, py(12), 90, oy - py(12));
                ctx.strokeStyle = '#54707f'; ctx.lineWidth = 2;
                ctx.strokeRect(px(D) + 6, py(12), 90, oy - py(12));
                // Bouton cible
                ctx.beginPath(); ctx.arc(px(D), py(1.5), 10, 0, 7);
                ctx.fillStyle = hit ? '#00ffcc' : '#ff4655'; ctx.fill();
                ctx.lineWidth = 2; ctx.strokeStyle = '#ece8e1'; ctx.stroke();
                ctx.fillStyle = '#ece8e1'; ctx.font = '12px monospace';
                ctx.fillText('BOUTON', px(D) - 20, py(1.5) - 18);
                // Archer
                ctx.fillStyle = '#ece8e1';
                ctx.beginPath(); ctx.arc(px(0), py(2.4), 8, 0, 7); ctx.fill();
                ctx.fillRect(px(0) - 3, py(2), 6, 20);
                ctx.strokeStyle = '#ece8e1'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.arc(px(0) + 6, py(1.5), 13, -1.2, 1.2); ctx.stroke();
                // Trajectoire
                if (flight) {
                    ctx.strokeStyle = 'rgba(255,235,59,0.8)';
                    ctx.lineWidth = 2; ctx.beginPath();
                    flight.trace.forEach((p, i) => i ? ctx.lineTo(px(p.x), py(p.y)) : ctx.moveTo(px(p.x), py(p.y)));
                    ctx.stroke();
                    const last = flight.trace[flight.trace.length - 1];
                    ctx.fillStyle = '#ffeb3b';
                    ctx.beginPath(); ctx.arc(px(last.x), py(last.y), 4, 0, 7); ctx.fill();
                }
            }

            function fire() {
                if (flight || mgSolved) return;
                shots++;
                document.getElementById('r-tir').textContent = 'Flèches tirées : ' + shots;
                feedback('');
                const v = parseFloat(sV.value), a = parseFloat(sA.value) * Math.PI / 180;
                flight = { t: 0, vx: v * Math.cos(a), vy: v * Math.sin(a), trace: [{ x: 0, y: 1.5 }], best: 999 };
                loop();
            }

            function loop() {
                flight.t += 0.018;
                const x = flight.vx * flight.t;
                const y = 1.5 + flight.vy * flight.t - 0.5 * G * flight.t * flight.t;
                flight.trace.push({ x, y });
                flight.best = Math.min(flight.best, Math.hypot(x - D, y - 1.5));
                drawScene();
                if (flight.best < 1.0) {
                    hit = true; drawScene();
                    mgSuccess('Bouton touché. Portée atteinte : 40 m.');
                    return;
                }
                if (y < 0 || x > 46) {
                    const chute = Math.min(x, 46).toFixed(1);
                    feedback('Raté : la flèche retombe à ' + chute + ' m au lieu de 40 m.', 'ko');
                    flight = null; drawScene();
                    return;
                }
                mgRaf = requestAnimationFrame(loop);
            }

            sV.oninput = () => document.getElementById('o-v').textContent = parseFloat(sV.value).toFixed(1) + ' m/s';
            sA.oninput = () => document.getElementById('o-a').textContent = sA.value + ' °';
            document.getElementById('b-fire').onclick = fire;
            drawScene();
        }
    };

    /* --- 2. Circuit : couper les bons fils ------------------ */
    MG.circuit = {
        html: `
        <div class="mg-wrap">
            <div class="mg-row" style="align-items:flex-start; gap:38px;">
                <div style="display:flex; flex-direction:column; gap:9px;" id="wires"></div>
                <div style="display:flex; flex-direction:column; gap:14px; align-items:center;">
                    <div class="mg-info">Ohmmètre</div>
                    <div class="ohm" id="ohm">40.0</div>
                    <div class="mg-info">R₀ en série : 20 Ω</div>
                    <div class="mg-info">Cible : <span class="ok">40,0 Ω</span></div>
                    <button class="mg-btn red" id="b-cut">Court-circuiter</button>
                </div>
            </div>
        </div>`,
        init() {
            const R = [120, 60, 40, 30, 24];
            const on = [true, true, true, true, true];
            const wrap = document.getElementById('wires');

            function req() {
                let g = 0;
                R.forEach((r, i) => { if (on[i]) g += 1 / r; });
                return g === 0 ? Infinity : 20 + 1 / g;
            }
            function render() {
                wrap.innerHTML = '';
                R.forEach((r, i) => {
                    const d = document.createElement('div');
                    d.className = 'wire' + (on[i] ? '' : ' cut');
                    const s = document.createElement('span');
                    s.textContent = 'R' + (i + 1) + ' = ' + r + ' Ω';
                    const b = document.createElement('button');
                    b.textContent = on[i] ? 'Couper' : 'Rétablir';
                    b.onclick = () => { on[i] = !on[i]; render(); };
                    d.appendChild(s); d.appendChild(b);
                    wrap.appendChild(d);
                });
                const v = req();
                document.getElementById('ohm').textContent = isFinite(v) ? v.toFixed(1) : 'ouvert';
            }
            document.getElementById('b-cut').onclick = () => {
                const v = req();
                if (Math.abs(v - 40) < 0.05) mgSuccess('Alarme court-circuitée. Req = 40,0 Ω.');
                else feedback('La tourelle reste armée. Req = ' + (isFinite(v) ? v.toFixed(1) + ' Ω' : 'circuit ouvert') + '.', 'ko');
            };
            render();
        }
    };

    /* --- 3. Cuve pneumatique -------------------------------- */
    MG.cuve = {
        html: `
        <div class="mg-wrap">
            <canvas class="mg" id="c-cuve" width="900" height="280"></canvas>
            <div class="mg-row">
                <div class="mg-ctrl">
                    <label>Volume V</label>
                    <input type="range" id="s-vol" min="0.02" max="0.12" step="0.005" value="0.12">
                    <span class="mg-val" id="o-vol">0.120 m³</span>
                </div>
                <div class="mg-ctrl">
                    <label>Température T</label>
                    <input type="range" id="s-t" min="250" max="500" step="5" value="250">
                    <span class="mg-val" id="o-t">250 K</span>
                </div>
                <button class="mg-btn" id="b-valve" disabled>Ouvrir la valve</button>
            </div>
        </div>`,
        init() {
            const cv = document.getElementById('c-cuve'), ctx = cv.getContext('2d');
            const W = cv.width, H = cv.height, n = 10, Rg = 8.3;
            const sV = document.getElementById('s-vol'), sT = document.getElementById('s-t');
            const parts = [];
            for (let i = 0; i < 45; i++) parts.push({ x: Math.random(), y: Math.random(), a: Math.random() * 7 });

            const P = () => n * Rg * parseFloat(sT.value) / parseFloat(sV.value) / 1000; // kPa

            function draw() {
                const V = parseFloat(sV.value), T = parseFloat(sT.value), p = P();
                const inZone = p >= 490 && p <= 510;
                ctx.clearRect(0, 0, W, H);

                const bx = 40, by = 40, bh = 180;
                const bw = 110 + (V - 0.02) / 0.1 * 300;
                ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(bx, by, bw, bh);
                ctx.strokeStyle = '#9fb2bd'; ctx.lineWidth = 4; ctx.strokeRect(bx, by, bw, bh);
                ctx.fillStyle = '#4d6b7d';
                ctx.fillRect(bx + bw, by - 8, 16, bh + 16);
                ctx.fillRect(bx + bw + 16, by + bh / 2 - 7, 55, 14);

                const sp = Math.sqrt(T / 250) * 0.006;
                ctx.fillStyle = inZone ? '#00ffcc' : '#8fd8ff';
                parts.forEach(q => {
                    q.x += Math.cos(q.a) * sp; q.y += Math.sin(q.a) * sp;
                    if (q.x < 0.02 || q.x > 0.98) { q.a = Math.PI - q.a; q.x = Math.min(0.98, Math.max(0.02, q.x)); }
                    if (q.y < 0.02 || q.y > 0.98) { q.a = -q.a; q.y = Math.min(0.98, Math.max(0.02, q.y)); }
                    ctx.beginPath(); ctx.arc(bx + q.x * bw, by + q.y * bh, 3, 0, 7); ctx.fill();
                });
                ctx.fillStyle = '#9fb2bd'; ctx.font = '13px monospace';
                ctx.fillText('CUVE PNEUMATIQUE', bx, by - 14);

                // Manomètre linéaire
                const gx = 540, gy = 70, gw = 300, gh = 26, pmax = 1400;
                ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fillRect(gx, gy, gw, gh);
                ctx.fillStyle = 'rgba(0,255,204,0.35)';
                ctx.fillRect(gx + 490 / pmax * gw, gy, 20 / pmax * gw, gh);
                ctx.strokeStyle = '#9fb2bd'; ctx.lineWidth = 2; ctx.strokeRect(gx, gy, gw, gh);
                const nx = gx + Math.min(p, pmax) / pmax * gw;
                ctx.fillStyle = inZone ? '#00ffcc' : '#ff4655';
                ctx.fillRect(nx - 2, gy - 9, 4, gh + 18);

                ctx.fillStyle = '#ece8e1'; ctx.font = '13px monospace';
                ctx.fillText('Zone d\'ouverture : 490 - 510 kPa', gx, gy - 22);
                ctx.font = 'bold 30px monospace';
                ctx.fillStyle = inZone ? '#00ffcc' : '#ff4655';
                ctx.fillText('P = ' + p.toFixed(0) + ' kPa', gx, gy + 96);
                ctx.font = '14px monospace'; ctx.fillStyle = '#9fb2bd';
                ctx.fillText('n = 10 mol    R = 8,3 J/(mol·K)', gx, gy + 128);

                document.getElementById('b-valve').disabled = !inZone;
                mgRaf = requestAnimationFrame(draw);
            }

            sV.oninput = () => document.getElementById('o-vol').textContent = parseFloat(sV.value).toFixed(3) + ' m³';
            sT.oninput = () => document.getElementById('o-t').textContent = sT.value + ' K';
            document.getElementById('b-valve').onclick = () => mgSuccess('Valve ouverte. P = ' + P().toFixed(0) + ' kPa.');
            draw();
        }
    };

    /* --- 4. Levier ----------------------------------------- */
    MG.levier = {
        html: `
        <div class="mg-wrap">
            <canvas class="mg" id="c-lev" width="900" height="320"></canvas>
            <div class="mg-row">
                <span class="mg-info">d1 = <span class="mg-val" id="o-d1"></span></span>
                <span class="mg-info">d2 = <span class="mg-val" id="o-d2"></span></span>
                <span class="mg-info">Force requise : <span class="mg-val" id="o-f"></span></span>
                <span class="mg-info">Maximum de Maël : 300 N</span>
                <button class="mg-btn" id="b-lift">Soulever</button>
            </div>
        </div>`,
        init() {
            const cv = document.getElementById('c-lev'), ctx = cv.getContext('2d');
            const W = cv.width, H = cv.height, L = 2.8, Pd = 1500, Fmax = 300;
            const ox = 120, sx = 230, ybar = 170;
            let d1 = 1.4, drag = false, lift = 0, lifting = false;

            const F = () => Pd * d1 / (L - d1);

            function draw() {
                const f = F(), ok = f <= Fmax;
                ctx.clearRect(0, 0, W, H);
                ctx.fillStyle = '#16242e'; ctx.fillRect(0, ybar + 56, W, H - ybar - 56);

                const pivot = ox + d1 * sx;
                const ang = -lift * 0.14;

                ctx.save();
                ctx.translate(pivot, ybar); ctx.rotate(ang);
                // Poutre
                ctx.fillStyle = '#a97c43';
                ctx.fillRect(-d1 * sx, -8, L * sx, 16);
                // Dalle posée sur l'extrémité gauche
                ctx.fillStyle = '#6f7d87';
                ctx.fillRect(-d1 * sx - 10, -82, 104, 74);
                ctx.strokeStyle = '#98a8b2'; ctx.lineWidth = 3;
                ctx.strokeRect(-d1 * sx - 10, -82, 104, 74);
                ctx.fillStyle = '#ece8e1'; ctx.font = 'bold 15px monospace';
                ctx.fillText('P = 1500 N', -d1 * sx + 2, -40);
                ctx.restore();

                // Pivot
                ctx.fillStyle = ok ? '#00ffcc' : '#ff4655';
                ctx.beginPath();
                ctx.moveTo(pivot, ybar + 8); ctx.lineTo(pivot - 26, ybar + 56); ctx.lineTo(pivot + 26, ybar + 56);
                ctx.closePath(); ctx.fill();
                ctx.fillStyle = '#0f1923'; ctx.font = 'bold 11px monospace';
                ctx.fillText('APPUI', pivot - 18, ybar + 48);

                // Mael et fleche de force
                const xm = ox + L * sx;
                ctx.fillStyle = '#ece8e1';
                ctx.beginPath(); ctx.arc(xm + 42, ybar - 60 - lift * 8, 12, 0, 7); ctx.fill();
                ctx.fillRect(xm + 36, ybar - 48 - lift * 8, 12, 44);
                ctx.strokeStyle = ok ? '#00ffcc' : '#ff4655'; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(xm, ybar - 82); ctx.lineTo(xm, ybar - 26); ctx.stroke();
                ctx.fillStyle = ok ? '#00ffcc' : '#ff4655';
                ctx.beginPath();
                ctx.moveTo(xm - 9, ybar - 26); ctx.lineTo(xm + 9, ybar - 26); ctx.lineTo(xm, ybar - 8);
                ctx.closePath(); ctx.fill();
                ctx.font = 'bold 15px monospace';
                ctx.fillText('F', xm + 14, ybar - 50);

                // Cotes
                ctx.strokeStyle = 'rgba(236,232,225,0.5)'; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.moveTo(ox, ybar + 78); ctx.lineTo(xm, ybar + 78); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(pivot, ybar + 70); ctx.lineTo(pivot, ybar + 86); ctx.stroke();
                ctx.fillStyle = '#ece8e1'; ctx.font = '13px monospace';
                ctx.fillText('d1', (ox + pivot) / 2 - 6, ybar + 100);
                ctx.fillText('d2', (pivot + xm) / 2 - 6, ybar + 100);
                ctx.fillStyle = 'rgba(236,232,225,0.6)'; ctx.font = '12px monospace';
                ctx.fillText('Glissez le point d\'appui', 20, 24);

                document.getElementById('o-d1').textContent = d1.toFixed(2) + ' m';
                document.getElementById('o-d2').textContent = (L - d1).toFixed(2) + ' m';
                const of = document.getElementById('o-f');
                of.textContent = f.toFixed(0) + ' N';
                of.className = 'mg-val ' + (ok ? 'ok' : 'ko');
                document.getElementById('b-lift').disabled = !ok || lifting;
            }

            function posX(e) {
                const r = cv.getBoundingClientRect();
                return (e.clientX - r.left) * cv.width / r.width;
            }
            function move(e) {
                if (lifting) return;
                let v = (posX(e) - ox) / sx;
                v = Math.min(2.4, Math.max(0.1, v));
                d1 = Math.round(v / 0.05) * 0.05;
                draw();
            }
            cv.onpointerdown = e => { drag = true; cv.setPointerCapture(e.pointerId); move(e); };
            cv.onpointermove = e => { if (drag) move(e); };
            cv.onpointerup = () => { drag = false; };
            cv.onpointercancel = () => { drag = false; };

            document.getElementById('b-lift').onclick = () => {
                lifting = true;
                const f = F();
                (function anim() {
                    lift += 0.035;
                    draw();
                    if (lift < 1) mgRaf = requestAnimationFrame(anim);
                    else mgSuccess('Dalle soulevée avec ' + f.toFixed(0) + ' N seulement.');
                })();
            };
            draw();
        }
    };

    /* --- 5. Binaire ---------------------------------------- */
    MG.binaire = {
        html: `
        <div class="mg-wrap">
            <div class="mg-row">
                <span class="mg-info">Verrou <span id="o-step">1</span> / 3 — code à composer</span>
                <div class="target-display" id="o-target">50</div>
            </div>
            <div class="mg-row" id="bits" style="gap:10px;"></div>
            <div class="mg-row">
                <button class="mg-btn" id="b-check">Couper le fil</button>
                <button class="mg-btn red" id="b-reset">Remettre à zéro</button>
            </div>
        </div>`,
        init() {
            const codes = [50, 173, 204];
            const POIDS = [128, 64, 32, 16, 8, 4, 2, 1];
            let bits = [0, 0, 0, 0, 0, 0, 0, 0], step = 0;
            const wrap = document.getElementById('bits');

            function render() {
                wrap.innerHTML = '';
                POIDS.forEach((w, i) => {
                    const d = document.createElement('div');
                    d.className = 'bit' + (bits[i] ? ' on' : '');
                    d.innerHTML = '<div class="v">' + bits[i] + '</div><div class="w">' + w + '</div>';
                    d.onclick = () => { bits[i] ^= 1; render(); };
                    wrap.appendChild(d);
                });
                document.getElementById('o-target').textContent = codes[step];
                document.getElementById('o-step').textContent = step + 1;
            }
            document.getElementById('b-check').onclick = () => {
                const v = bits.reduce((s, b, i) => s + b * POIDS[i], 0);
                if (v === codes[step]) {
                    const cible = codes[step];
                    step++;
                    bits = [0, 0, 0, 0, 0, 0, 0, 0];
                    if (step === 3) { mgSuccess('Trois verrous ouverts. Noyau accessible.'); return; }
                    feedback('Fil coupé : ' + cible + ' validé. Verrou suivant.', 'ok');
                    render();
                } else {
                    feedback('Refusé : vous avez composé ' + v + ' au lieu de ' + codes[step] + '.', 'ko');
                }
            };
            document.getElementById('b-reset').onclick = () => { bits = [0, 0, 0, 0, 0, 0, 0, 0]; render(); };
            render();
        }
    };

    /* =======================================================
       ÉCRAN DE CALCUL
       ======================================================= */
    function startCalc(scene) {
        const root = document.getElementById('minigame-root');
        root.innerHTML = `
        <div class="mg-wrap">
            <div class="calc-data">${scene.data}</div>
            <div class="mg-row">
                <input class="calc-input" id="calc-input" placeholder="Résultat" autocomplete="off">
                <span class="calc-unit">${scene.unit}</span>
                <button class="mg-btn" id="b-calc">Valider</button>
                <span class="mg-info" id="calc-tries">Essais : 0</span>
            </div>
        </div>`;
        const inp = document.getElementById('calc-input');
        let tries = 0;

        function check() {
            const brut = inp.value.trim().replace(',', '.').replace(/\s/g, '');
            const v = parseFloat(brut);
            if (brut === '' || isNaN(v)) {
                feedback('Entrez une valeur numérique.', 'ko');
                return;
            }
            tries++;
            document.getElementById('calc-tries').textContent = 'Essais : ' + tries;
            if (Math.abs(v - scene.answer) <= scene.tol) {
                mgSuccess('Valeur validée. Passez à l\'application.');
            } else {
                feedback('Valeur refusée par le terminal. Reprenez le calcul.', 'ko');
                inp.select();
            }
        }
        document.getElementById('b-calc').onclick = check;
        inp.addEventListener('keydown', e => { if (e.key === 'Enter') check(); });
        inp.focus();
    }

    /* =======================================================
       MOTEUR DE SCÈNES
       ======================================================= */
    function renderScene() {
        const scene = story[currentScene];
        const container = document.getElementById('game-container');
        const sprite = document.getElementById('character-sprite');
        const dialogBox = document.getElementById('dialog-box');
        const puzzleUi = document.getElementById('puzzle-ui');

        stopMg();

        // Gestion du fond
        const blur = document.getElementById('bg-blur');
        if (scene.bg) {
            container.style.backgroundImage = `url('${scene.bg}')`;
            if (scene.fit === 'contain') {
                container.style.backgroundSize = 'contain';
                container.style.backgroundRepeat = 'no-repeat';
                blur.style.backgroundImage = `url('${scene.bg}')`;
                blur.style.display = 'block';
            } else {
                container.style.backgroundSize = 'cover';
                blur.style.display = 'none';
            }
        } else {
            container.style.backgroundImage = 'none';
            blur.style.display = 'none';
        }

        if (scene.type === 'dialog') {
            dialogBox.style.display = 'flex';
            puzzleUi.style.display = 'none';
            document.getElementById('minigame-root').innerHTML = '';

            document.getElementById('character-name').innerText = scene.speaker;
            document.getElementById('dialog-text').innerHTML = scene.text;

            if (scene.char) {
                sprite.src = scene.char;
                sprite.style.display = 'block';
                sprite.style.opacity = '1';
            } else {
                sprite.style.display = 'none';
                sprite.style.opacity = '0';
            }
        }
        else if (scene.type === 'calc') {
            dialogBox.style.display = 'none';
            puzzleUi.style.display = 'block';
            sprite.style.display = 'none';

            document.getElementById('puzzle-title').innerHTML = scene.title;
            document.getElementById('puzzle-desc').innerHTML = scene.desc;
            feedback('');
            mgSolved = false;
            startCalc(scene);
        }
        else if (scene.type === 'minigame') {
            dialogBox.style.display = 'none';
            puzzleUi.style.display = 'block';
            sprite.style.display = 'none';

            document.getElementById('puzzle-title').innerHTML = scene.title;
            document.getElementById('puzzle-desc').innerHTML = scene.desc;
            feedback('');
            mgSolved = false;
            document.getElementById('minigame-root').innerHTML = MG[scene.game].html;
            MG[scene.game].init();
        }
    }

    function nextScene() {
        stopMg();
        if (currentScene < story.length - 1) {
            currentScene++;
            renderScene();
        } else {
            alert('Félicitations Agent ! Vous avez terminé l\'Opération Radianite.');
        }
    }

    renderScene();
</script>
</body>
</html>
